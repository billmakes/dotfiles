##### Terminal #####

# Use tmux-256color for proper Unicode/Nerd Font support
# (screen-256color has broken Unicode rendering)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"


##### General #####

# Prefix: C-a instead of C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# No delay for escape (for vim)
set -sg escape-time 0

# Start window/pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Increase scrollback
set -g history-limit 50000

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"


##### Navigation #####

# Vi mode
set -g mode-keys vi
set -g status-keys vi

# Vi copy-mode bindings
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# Pane switching (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Last window (prefix + ^)
bind ^ last-window

# Splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# No-prefix pane switching (Alt + arrows)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# No-prefix window switching (Shift + arrows)
bind -n S-Left  previous-window
bind -n S-Right next-window

# No-prefix window switching (Alt+Shift + HL)
bind -n M-H previous-window
bind -n M-L next-window

# Session tree (prefix + s)
bind s choose-tree -Zs


##### Status bar #####

set -g status-position top
set -g status-interval 1
set -g status-style "bg=#131111,fg=#888888"

# Left: empty
set -g status-left ""
set -g status-left-length 20

# Right: session, git branch, date, time
set -g status-right "#[fg=#888888]#S #[fg=#565B66,bg=#0B0E14,bold]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#0B0E14,bg=#39BAE6,bold] %d/%m #[fg=#0B0E14,bg=#E6B450,bold] %H:%M:%S "
set -g status-right-length 100


##### Window styling #####

setw -g window-status-style "fg=#565B66,bg=#0B0E14"
setw -g window-status-format " #I:#W#F "

setw -g window-status-current-style "fg=#565B66,bg=#0B0E14,bold"
setw -g window-status-current-format " #I:#W#F "

setw -g window-status-bell-style "fg=#FFFFFF,bg=#FF5D62,bold"


##### Pane styling #####

set -g pane-border-style "bg=#0B0E14,fg=#11151C"
set -g pane-active-border-style "bg=#0B0E14,fg=#39BAE6"


##### Messages / modes #####

set -g message-style "fg=#000000,bg=#FFA065,bold"
set -g mode-style "fg=#0B0E14,bg=#39BAE6,bold"
set -g clock-mode-colour "#947FB8"


##### Quiet mode #####

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
