# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Sessions and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g detach-on-destroy off
set -g history-limit 100000
set -g escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g display-time 2500
set -g display-panes-time 2000

# Terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,foot:RGB,alacritty:RGB,kitty:RGB"
set -as terminal-features ",wezterm:RGB,tmux-256color:RGB"
set -g allow-passthrough on
set -g set-clipboard on

# Mouse and copy mode
set -g mouse on
setw -g mode-keys vi
bind [ copy-mode
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Clipboard helpers
bind y run-shell "tmux save-buffer - | wl-copy"
bind p paste-buffer

# Splits and navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window movement
bind -r C-h previous-window
bind -r C-l next-window
bind < swap-window -d -t -1
bind > swap-window -d -t +1

# Quality-of-life commands
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind R refresh-client -S
bind x kill-pane
bind X kill-window

# Status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour245"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=colour39,bold] #S #[fg=colour240]- "
set -g status-right "#[fg=colour240]- #[fg=colour250]%Y-%m-%d #[fg=colour39]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour245] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=colour16,bg=colour39,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-activity-style "fg=colour214"

# Pane borders and messages
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=colour238,fg=colour255"
set -g message-command-style "bg=colour238,fg=colour255"
set -g mode-style "bg=colour39,fg=colour16"
