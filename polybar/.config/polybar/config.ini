;  Polybar — i3bar palette, colored module blocks.

[colors]
bg     = #000000
fg     = #ffffff
spotify = #81b71a

; i3bar default workspace button palette
ws-focused-bg     = #285577
ws-focused-border = #4c7899
ws-focused-fg     = #ffffff
ws-active-bg      = #5f676a
ws-active-border  = #333333
ws-active-fg      = #ffffff
ws-inactive-bg    = #222222
ws-inactive-border = #333333
ws-inactive-fg    = #888888
ws-urgent-bg      = #900000
ws-urgent-border  = #2f343a
ws-urgent-fg      = #ffffff

; Module block colors
c-snapshot = #8b0000
c-spotify  = #1c2833
c-disk     = #784212
c-cpu      = #1a237e
c-memory   = #4a235a
c-volume   = #0000aa
c-weather  = #1b5e20
c-date     = #7b3800
c-time     = #006064

h-snapshot = #bd3232
h-spotify  = #4e5a65
h-disk     = #aa7444
h-cpu      = #4c55b0
h-memory   = #7c558c
h-volume   = #3232dc
h-weather  = #4d9052
h-date     = #ad6a32
h-time     = #329296

[bar/left]
monitor = HDMI-A-0
width   = 100%
height  = 24
radius  = 0
fixed-center = false
bottom = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2

padding-left        = 0
padding-right       = 2
module-margin-left  = 0
module-margin-right = 2

font-0 = JetBrainsMono Nerd Font Mono:pixelsize=10;2

modules-left  = i3
modules-right = snapshot spotify disk cpu memory volume weather date time

cursor-click  = pointer
cursor-scroll = ns-resize

[bar/right]
monitor = DisplayPort-2
width   = 100%
height  = 24
radius  = 0
fixed-center = false
bottom = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2

padding-left        = 0
padding-right       = 2
module-margin-left  = 0
module-margin-right = 2

font-0 = JetBrainsMono Nerd Font Mono:pixelsize=10;2

modules-left  = i3
modules-right = snapshot spotify disk cpu memory volume weather date time tray

cursor-click  = pointer
cursor-scroll = ns-resize

;----------------------------------------------------------
; SYSTEM TRAY
;----------------------------------------------------------

[module/tray]
type = internal/tray
tray-padding = 2

;----------------------------------------------------------
; WORKSPACES
;----------------------------------------------------------

[module/i3]
type = internal/i3
pin-workspaces  = true
index-sort      = true
strip-wsnumbers = false
wrapping-scroll = false

format = <label-state> <label-mode>

label-mode            = %mode%
label-mode-padding    = 2
label-mode-background = ${colors.ws-urgent-bg}
label-mode-foreground = ${colors.ws-urgent-fg}

label-focused            = %name%
label-focused-background = ${colors.ws-focused-bg}
label-focused-foreground = ${colors.ws-focused-fg}
label-focused-underline  = ${colors.ws-focused-border}
label-focused-padding    = 2

label-unfocused            = %name%
label-unfocused-background = ${colors.ws-inactive-bg}
label-unfocused-foreground = ${colors.ws-inactive-fg}
label-unfocused-underline  = ${colors.ws-inactive-border}
label-unfocused-padding    = 2

label-visible            = %name%
label-visible-background = ${colors.ws-active-bg}
label-visible-foreground = ${colors.ws-active-fg}
label-visible-underline  = ${colors.ws-active-border}
label-visible-padding    = 2

label-urgent            = %name%
label-urgent-background = ${colors.ws-urgent-bg}
label-urgent-foreground = ${colors.ws-urgent-fg}
label-urgent-underline  = ${colors.ws-urgent-border}
label-urgent-padding    = 2

;----------------------------------------------------------
; BTRFS SNAPSHOT INDICATOR
;----------------------------------------------------------

[module/snapshot]
type = custom/script
exec    = ~/.config/i3blocks/scripts/root-snapshot | head -1
exec-if = ~/.config/i3blocks/scripts/root-snapshot | grep -q .
interval = 60

format-background = ${colors.c-snapshot}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-snapshot}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-snapshot}
label             = %output%
label-padding     = 1

;----------------------------------------------------------
; NOW PLAYING (Spotify)
;----------------------------------------------------------

[module/spotify]
type = custom/script
exec    = ~/bin/spotify.py 2>/dev/null
exec-if = pgrep -x spotify >/dev/null && test -x ~/bin/spotify.py
interval = 5

format-background        = ${colors.c-spotify}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-spotify}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-spotify}
format-prefix            = " "
format-prefix-foreground = ${colors.spotify}
label                    = %output:0:40%
label-foreground         = ${colors.spotify}
label-padding            = 1

;----------------------------------------------------------
; DISK
;----------------------------------------------------------

[module/disk]
type = custom/script
exec = df -P / /mnt/storage 2>/dev/null | awk 'NR==2{r=$5} NR==3{s=$5} END { if (s) printf "root %s \xe2\x80\xa2 storage %s", r, s; else printf "root %s", r }'
interval = 30

format-background = ${colors.c-disk}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-disk}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-disk}
format-prefix     = "󰋊 "
label             = %output%
label-padding     = 1

;----------------------------------------------------------
; CPU
;----------------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 5

format-background = ${colors.c-cpu}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-cpu}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-cpu}
format-prefix     = " "
label             = %percentage%%
label-padding     = 1

;----------------------------------------------------------
; MEMORY
;----------------------------------------------------------

[module/memory]
type = internal/memory
interval = 5

format-background = ${colors.c-memory}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-memory}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-memory}
format-prefix     = " "
label             = %gb_used% / %gb_free%
label-padding     = 1

;----------------------------------------------------------
; VOLUME (PulseAudio)
;----------------------------------------------------------

[module/volume]
type = internal/pulseaudio
sink      = @DEFAULT_SINK@
use-ui-max = true
interval  = 5

format-volume            = <ramp-volume>  <label-volume>
format-volume-background = ${colors.c-volume}
format-volume-underline  = ${colors.bg}
format-volume-overline          = ${colors.h-volume}
format-volume-suffix            = "▐"
format-volume-suffix-foreground = ${colors.bg}
format-volume-suffix-background = ${colors.c-volume}
label-volume             = %percentage%%
label-volume-padding     = 1

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

format-muted-prefix            = "󰝟 "
format-muted-background        = ${colors.c-volume}
format-muted-underline         = ${colors.bg}
format-muted-overline          = ${colors.h-volume}
format-muted-suffix            = "▐"
format-muted-suffix-foreground = ${colors.bg}
format-muted-suffix-background = ${colors.c-volume}
label-muted                    = mute
label-muted-padding            = 1

click-right = pavucontrol &

;----------------------------------------------------------
; WEATHER
;----------------------------------------------------------

[module/weather]
type = custom/script
exec     = ~/.config/i3blocks/scripts/wttr
interval = 1800

format-background = ${colors.c-weather}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-weather}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-weather}
format-prefix     = " "
label             = %output%
label-padding     = 1

;----------------------------------------------------------
; DATE
;----------------------------------------------------------

[module/date]
type = internal/date
interval = 60
date     = %m-%d-%Y
date-alt = %A %B %d, %Y

format-background = ${colors.c-date}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-date}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-date}
format-prefix     = " "
label             = %date%
label-padding     = 1

;----------------------------------------------------------
; TIME
;----------------------------------------------------------

[module/time]
type = internal/date
interval = 5
time     = %I:%M %p
time-alt = %H:%M:%S

format-background = ${colors.c-time}
format-underline  = ${colors.bg}
format-overline   = ${colors.h-time}
format-suffix     = "▐"
format-suffix-foreground = ${colors.bg}
format-suffix-background = ${colors.c-time}
format-prefix     = " "
label             = %time%
label-padding     = 1
